apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-observability
  labels:
    app: llm-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-observability
  template:
    metadata:
      labels:
        app: llm-observability
    spec:
      containers:
        - name: api
          image: ghcr.io/artsiomrudenia/llm-observability:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-observability
spec:
  selector:
    app: llm-observability
  ports:
    - name: http
      port: 80
      targetPort: 8080
